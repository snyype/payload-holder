name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Windows file metadata (product name/version) — required by SignPath and shown in file Properties.
      - name: Generate Windows version resources
        run: |
          go install github.com/tc-hib/go-winres@latest
          ver="${GITHUB_REF_NAME#v}"; ver="${ver%%-*}.0"
          "$(go env GOPATH)/bin/go-winres" simply --arch amd64,arm64 --manifest cli \
            --product-name payload --product-version "$ver" --file-version "$ver" \
            --file-description "payload - save and retrieve named JSON payloads" \
            --original-filename payload.exe --copyright "Copyright (c) 2026 snyype"

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/payload_${os}_${arch}${ext}" .
          done
          ls -la dist

      # Code signing via SignPath (free for open source). Skipped until the repo variable
      # SIGNPATH_ORGANIZATION_ID is set, so releases keep working before SignPath is configured.
      - name: Upload unsigned Windows binaries
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Sign Windows binaries (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing needs a manual approval in SignPath; allow time for it.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Replace Windows binaries with signed ones
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          for f in dist/*.exe; do
            s="signed/$(basename "$f")"
            [ -f "$s" ] || { echo "missing signed file $s"; exit 1; }
            cp -f "$s" "$f"
          done
          sudo apt-get install -y -qq osslsigncode >/dev/null
          for f in dist/*.exe; do osslsigncode verify -in "$f" | grep -E "Signer|Succeeded|Failed" ; done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
