name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Windows file metadata (product name/version) and the app icon (assets/icon.png, 256x256),
      # shown in Explorer, the taskbar and the .exe file Properties.
      - name: Generate Windows version resources
        run: |
          go install github.com/tc-hib/go-winres@latest
          ver="${GITHUB_REF_NAME#v}"; ver="${ver%%-*}.0"
          "$(go env GOPATH)/bin/go-winres" simply --arch amd64,arm64 --manifest cli --icon assets/icon.png \
            --product-name payload --product-version "$ver" --file-version "$ver" \
            --file-description "payload - save and retrieve named JSON payloads" \
            --original-filename payload.exe --copyright "Copyright (c) 2026 snyype"

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          GITHUB_CLIENT_ID: ${{ secrets.PAYLOAD_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PAYLOAD_GITHUB_CLIENT_SECRET }}
          GITHUB_APP_SLUG: ${{ vars.PAYLOAD_GITHUB_APP_SLUG }}
        run: |
          [ -n "$GITHUB_CLIENT_ID" ] && [ -n "$GITHUB_CLIENT_SECRET" ] || { echo "PAYLOAD_GITHUB_CLIENT_ID / PAYLOAD_GITHUB_CLIENT_SECRET secrets are not set"; exit 1; }
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.githubClientID=${GITHUB_CLIENT_ID} -X main.githubClientSecret=${GITHUB_CLIENT_SECRET} -X main.githubAppSlug=${GITHUB_APP_SLUG}" \
              -o "dist/payload_${os}_${arch}${ext}" .
          done
          ls -la dist

      # The official curl.se Windows build, shipped as curl_windows_<arch>.exe for "payload curl"
      # (installed to bin/curl/curl.exe). Each zip is checked against the SHA-256 curl.se publishes.
      - name: Bundle curl for Windows
        run: |
          for pair in amd64:win64 arm64:win64a; do
            arch="${pair%%:*}"; build="${pair#*:}"
            url="$(curl -fsSI "https://curl.se/windows/latest.cgi?p=${build}-mingw.zip" | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')"
            [ -n "$url" ] || { echo "no curl download for $build"; exit 1; }
            curl -fsSL -o curl.zip "$url"
            expected="$(curl -fsSL "$url.txt" | awk -F' = ' '/^SHA256/ {print $2}')"
            actual="$(sha256sum curl.zip | awk '{print $1}')"
            echo "$url sha256 $actual"
            [ -n "$expected" ] && [ "$expected" = "$actual" ] || { echo "curl checksum mismatch: expected '$expected'"; exit 1; }
            unzip -j -o curl.zip '*/bin/curl.exe' -d "curl_$arch"
            mv "curl_$arch/curl.exe" "dist/curl_windows_${arch}.exe"
            rm -rf curl.zip "curl_$arch"
          done
          ls -la dist

      # Microsoft's OpenSSH for Windows client (github.com/PowerShell/Win32-OpenSSH), shipped as
      # ssh_windows_<arch>.zip for "payload ssh" (installed to bin/ssh/). Each zip is checked against
      # the SHA-256 GitHub publishes for the release asset; only the client files are repackaged.
      - name: Bundle ssh for Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/PowerShell/Win32-OpenSSH/releases/latest)"
          echo "OpenSSH for Windows $(echo "$rel" | jq -r .tag_name)"
          for pair in amd64:OpenSSH-Win64 arm64:OpenSSH-ARM64; do
            arch="${pair%%:*}"; name="${pair#*:}"
            url="$(echo "$rel" | jq -r --arg n "$name.zip" '.assets[] | select(.name == $n) | .browser_download_url')"
            expected="$(echo "$rel" | jq -r --arg n "$name.zip" '.assets[] | select(.name == $n) | .digest' | sed 's/^sha256://')"
            [ -n "$url" ] && [ -n "$expected" ] && [ "$expected" != null ] || { echo "no $name.zip with a digest"; exit 1; }
            curl -fsSL -o ssh.zip "$url"
            actual="$(sha256sum ssh.zip | awk '{print $1}')"
            echo "$url sha256 $actual"
            [ "$expected" = "$actual" ] || { echo "ssh checksum mismatch: expected '$expected'"; exit 1; }
            rm -rf sshpkg && unzip -j -o ssh.zip "$name/ssh.exe" "$name/libcrypto.dll" "$name/LICENSE.txt" "$name/NOTICE.txt" -d sshpkg
            (cd sshpkg && zip -q -X "../dist/ssh_windows_${arch}.zip" ssh.exe libcrypto.dll LICENSE.txt NOTICE.txt)
            rm -rf ssh.zip sshpkg
          done
          ls -la dist

      # SHA-256 of every binary, published with the release; install.sh and "payload doctor" check
      # downloads against it.
      - name: Checksums
        run: |
          cd dist
          sha256sum payload_* curl_* ssh_* > SHA256SUMS
          cat SHA256SUMS

      # The release notes are this tag's section of CHANGELOG.md ("## vX.Y.Z — date"); "payload doctor"
      # shows the same text under "What's new". A tag without a section fails here, before publishing.
      - name: Release notes
        run: |
          awk -v tag="$GITHUB_REF_NAME" '/^## /{p = ($2 == tag); next} p' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
